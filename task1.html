<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Showroom</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

/* Navbar */
nav{
  background:#000;
  color:#fff;
  display:flex;
  justify-content:space-between;
  padding:15px 40px;
}
nav h1{
  color:#00ffcc;
}
nav ul{
  display:flex;
  list-style:none;
}
nav ul li{
  margin-left:25px;
}
nav ul li a{
  color:#fff;
  text-decoration:none;
}

/* Hero Section */
.hero{
  height:100vh;
  background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
  url('https://images.unsplash.com/photo-1609630875171-b1321377ee65') center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
}
.hero h1{
  font-size:55px;
}
.hero p{
  margin:15px 0;
}

/* Bikes Section */
.bikes{
  padding:60px;
  text-align:center;
}
.bike-container{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
}
.bike{
  width:280px;
  margin:15px;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  transition:0.3s;
}
.bike:hover{
  transform:translateY(-10px);
}
.bike img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.bike h3{
  padding:10px;
}

/* Footer */
footer{
  background:#000;
  color:#fff;
  text-align:center;
  padding:15px;
}
</style>
</head>
